name: Desktop bundle

# `pnpm tauri build` only produces a runnable artifact on a standard-distro CI runner — a
# Nix-built binary embeds a `/nix/store/...` ELF interpreter path and cannot run outside NixOS,
# and Tauri's AppImage step needs a `linuxdeploy` binary that also cannot execute *on* NixOS. This
# is the workflow docs/player-torrent-roadmap.md (Phase 1, "Packaging") and README.md's
# "Desktop (Tauri)" section both point at as "not yet set up." `ubuntu-latest` is a real Debian
# derivative, so the bundle it produces runs unmodified on Fedora/Debian/Ubuntu machines
# (AppImage) or installs natively (.deb/.rpm).
#
# This workflow builds and uploads the bundle; it does not yet prove the bundle *plays a file* —
# that needs a display and a GPU, which a GitHub-hosted runner does not have. Verifying playback
# is still a manual step on real hardware (see the roadmap's acceptance-run checklist).

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: The family API's public URL, baked into this build as VITE_API_URL.
        required: true
        default: https://arcadia.family.fun
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ inputs.api_url || 'https://arcadia.family.fun' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install Tauri/libmpv/packaging system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libmpv-dev libssl-dev libxdo-dev rpm file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the desktop bundle
        run: pnpm tauri build --bundles appimage,deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: arcadia-desktop-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
