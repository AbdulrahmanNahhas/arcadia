name: Publish images

# Builds the server images the Fedora/Podman deployment pulls (see deploy/quadlet and README's
# "Self-hosting on Fedora Atomic"): ghcr.io/<owner>/arcadia-api and arcadia-web. Every push to
# master publishes `latest` + `sha-<short>`; a `v*` tag additionally publishes that version tag,
# which is the one to pin in a Quadlet unit when you want updates to be deliberate rather than
# whatever `podman auto-update` finds. Needs nothing beyond the workflow's own GITHUB_TOKEN.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: arcadia-api
            dockerfile: apps/api/Dockerfile
          - name: arcadia-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the owner for us (GHCR requires it).
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
